[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ptp"
version = "0.1.0"
description = "Modular pairs-trading research platform with an ML signal filter"
readme = "README.md"
requires-python = ">=3.11"
# Core dependencies: needed by every module (contracts, data, backtester).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Data download and statistics (O1 + O3).
data = [
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5.0",
    "statsmodels>=0.14",
    "scipy>=1.12",
]
# Machine learning (O2).
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "optuna>=3.6",
    "shap>=0.45",
]
# Backend: API + database (O3).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
# Frontend (O3 skeleton, O1/O2 charts).
frontend = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "requests>=2.31",
]
# Development tools.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Everything at once: pip install -e ".[all]"
all = ["ptp[data,ml,api,frontend,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: tests that combine several modules",
    "leakage: no-lookahead tests (contract section 14)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Contract/docs code blocks are hand-aligned for readability; do not reformat them.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
